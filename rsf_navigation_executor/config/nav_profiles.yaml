profiles:
  default: {}
  wide_road: # 市役所から外へ向かう広い道 (S1). 遅いロボットにはついていかず, global の障害物層で経路ごと避けて追い越す
    parameters:
      /yield_guard:
        follow_enabled: false
      /global_costmap/global_costmap:
        obstacle_layer.enabled: true # 追従で切った層が残っていても必ず戻す
  following: # 追い越しをしないパラメータ
    parameters:
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0 # 追従待機中に後退しない
        FollowPath.PathAlignCritic.cost_weight: 20.0 # 前走で経路がふさがっていても経路に沿わせる. 横へずれて芝生の keepout に触れると動けなくなる
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /queue_guard:
        enabled: true
      /yield_guard:
        follow_enabled: false
  narrow: # 市役所横の柱向けのパラメータ
    parameters:
      /local_costmap/local_costmap:
        footprint_padding: 0.0
        inflation_layer.inflation_radius: 1.0
        inflation_layer.cost_scaling_factor: 6.0
      /controller_server:
        FollowPath.forward_sampling_distance: 1.5
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
        FollowPath.vx_min: -0.3
        FollowPath.CostCritic.cost_weight: 5.0
        progress_checker.movement_time_allowance: 180.0
      /queue_guard:
        enabled: true
        half_width: 0.7 # 経路の左右これ以内の物体だけ待機列とみなす. 1.5 だと通路の端に止まったロボット (柱との隙間 約1.65m) の手前で止まり続ける
      /yield_guard:
        follow_enabled: false
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        footprint_padding: 0.0
  speed_down: # 低速ならLIOの誤差も小さくなるはず...？
    speed_limit: 0.5
  speed_down_following: # 確認走行区間の横断歩道前の待機列 (speed_down + following)
    speed_limit: 0.5
    parameters:
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0
      /queue_guard:
        enabled: true
      /yield_guard:
        follow_enabled: false
  road_edge_keep:
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0 # 高コスト領域を避ける強さ default: 2.0
      /controller_server: # global pathへの依存を強くする変更
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /yield_guard:
        enabled: true
      /global_costmap/global_costmap:
        footprint_padding: 0.25 # global は local (0.15) より慎重に: 植え込みと物体の狭い隙間に経路を引かない
  road_edge_keep_poles: # S3 のポール列 (WP100-112). ポールの間 (約1.3m) を通すため余裕を 0.22 に下げる. 0.25 だと歩行者側を回る
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0
      /controller_server:
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /yield_guard:
        enabled: true
      /global_costmap/global_costmap:
        footprint_padding: 0.22
  road_edge_keep_following:
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0
      /global_costmap/global_costmap:
        footprint_padding: 0.25 # global は local (0.15) より慎重に: 植え込みと物体の狭い隙間に経路を引かない
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0 # 追従待機中に後退しない
      /queue_guard:
        enabled: true
      /yield_guard:
        follow_enabled: false
  signal_queue: # 信号の停止点そのものへ向かう最後の区間に自動で重ねる: waypoint の線上の待機列の後ろで止まる (経路は物体を避けたまま)
    parameters:
      /queue_guard:
        enabled: true
        use_route: true
        min_object_size: 0.48 # コーン (直径 0.36m, 格子で約 0.45m) を待機列とみなさない. 人 (0.5m) とロボットは残す
      /yield_guard:
        follow_enabled: false
