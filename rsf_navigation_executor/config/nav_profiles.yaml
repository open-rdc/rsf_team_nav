profiles:
  default: {}
  wide_road: # 市役所から外へ向かう広い道 (S1). 遅いロボットにはついていかず, global の障害物層で経路ごと避けて追い越す
    parameters:
      /yield_guard:
        follow_enabled: false
      /global_costmap/global_costmap:
        obstacle_layer.enabled: true # 追従で切った層が残っていても必ず戻す
  following: # 追い越しをしないパラメータ
    parameters:
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0 # 追従待機中に後退しない
        FollowPath.PathAlignCritic.cost_weight: 20.0 # 前走で経路がふさがっていても経路に沿わせる. 横へずれて芝生の keepout に触れると動けなくなる
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /queue_guard:
        enabled: true
        min_object_size: 0.48 # 歩道のコーン列 (costmap で約 0.45m) を前の列とみなさない
        tall_span: 0.78 # 上の点の高さの幅が 0.78m 以上の塊は小さくても数える (脚 2 本に分かれて見える人. コーンは 0.7m)
      /yield_guard:
        follow_enabled: false
  following_center: # WP10-17: following に加え, global の膨張を広く緩やかにして道の真ん中に経路を引く
    parameters:
      /global_costmap/global_costmap:
        inflation_layer.inflation_radius: 3.0 # 既定 1.0. 道の端から 3m まで勾配を付ける
        inflation_layer.cost_scaling_factor: 1.0 # 既定 3.0. 小さいほど端から離れてもコストが残り, 中央が最も低くなる
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /local_costmap/local_costmap:
        inflation_layer.inflation_radius: 0.5 # 既定 1.0. 傾斜を誤って障害物とみなしたセルの周りに広がるコストを狭める
        inflation_layer.cost_scaling_factor: 6.0 # 既定 3.0. narrow と同じ. 縁から離れるとすぐコストが落ちる
      /controller_server:
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0 # 追従待機中に後退しない
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
        FollowPath.CostCritic.cost_weight: 5.0 # 既定 10. 傾斜の誤検出の膨張から横へ逃げる力を弱める (LETHAL の回避は collision_cost で残る)
        FollowPath.PathFollowCritic.cost_weight: 25.0 # 既定 15. 傾斜で経路から外れても先の経路へ引き戻す
        FollowPath.PathAngleCritic.cost_weight: 4.0 # 既定 2. 経路と違う向きに機首を振るのを抑える
      /queue_guard:
        enabled: true
        min_object_size: 0.48 # 歩道のコーン列 (costmap で約 0.45m) を前の列とみなさない
        tall_span: 0.78 # 上の点の高さの幅が 0.78m 以上の塊は小さくても数える (脚 2 本に分かれて見える人. コーンは 0.7m)
      /yield_guard:
        follow_enabled: false
  narrow: # 市役所横の柱向けのパラメータ
    parameters:
      /local_costmap/local_costmap:
        footprint_padding: 0.0
        inflation_layer.inflation_radius: 1.0
        inflation_layer.cost_scaling_factor: 6.0
      /controller_server:
        FollowPath.forward_sampling_distance: 1.5
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
        FollowPath.vx_min: -0.3
        FollowPath.CostCritic.cost_weight: 5.0
        progress_checker.movement_time_allowance: 180.0
      /queue_guard:
        enabled: true
        half_width: 0.7 # 経路の左右これ以内の物体だけ待機列とみなす. 1.5 だと通路の端に止まったロボット (柱との隙間 約1.65m) の手前で止まり続ける
      /yield_guard:
        follow_enabled: false
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        footprint_padding: 0.0
  speed_down: # 低速ならLIOの誤差も小さくなるはず...？
    speed_limit: 0.5
  speed_down_following: # 確認走行区間の横断歩道前の待機列 (speed_down + following)
    speed_limit: 0.5
    parameters:
      /global_costmap/global_costmap:
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0
      /queue_guard:
        enabled: true
        min_object_size: 0.48 # 歩道のコーン列 (costmap で約 0.45m) を前の列とみなさない
        tall_span: 0.78 # 上の点の高さの幅が 0.78m 以上の塊は小さくても数える (脚 2 本に分かれて見える人. コーンは 0.7m)
      /yield_guard:
        follow_enabled: false
  road_edge_keep:
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0 # 高コスト領域を避ける強さ default: 2.0
      /controller_server: # global pathへの依存を強くする変更
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /yield_guard:
        enabled: true
      /global_costmap/global_costmap:
        footprint_padding: 0.25 # global は local (0.15) より慎重に: 植え込みと物体の狭い隙間に経路を引かない
  road_edge_keep_poles: # S3 のポール列 (WP100-112). ポールの間 (約1.3m) を通すため余裕を 0.22 に下げる. 0.25 だと歩行者側を回る
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0
      /controller_server:
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
      /yield_guard:
        enabled: true
      /global_costmap/global_costmap:
        footprint_padding: 0.22
  road_edge_keep_following:
    parameters:
      /planner_server:
        GridBased.cost_travel_multiplier: 1.0
      /global_costmap/global_costmap:
        footprint_padding: 0.25 # global は local (0.15) より慎重に: 植え込みと物体の狭い隙間に経路を引かない
        obstacle_layer.enabled: false
        pedestrian_layers.enabled: false
        pedestrian_layers.obstacle_layer.enabled: false
      /controller_server:
        FollowPath.PathAlignCritic.cost_weight: 20.0
        FollowPath.PathAlignCritic.max_path_occupancy_ratio: 1.0
        progress_checker.movement_time_allowance: 180.0
        failure_tolerance: 5.0
        FollowPath.vx_min: 0.0 # 追従待機中に後退しない
      /queue_guard:
        enabled: true
        min_object_size: 0.48 # 歩道のコーン列 (costmap で約 0.45m) を前の列とみなさない
        tall_span: 0.78 # 上の点の高さの幅が 0.78m 以上の塊は小さくても数える (脚 2 本に分かれて見える人. コーンは 0.7m)
      /yield_guard:
        follow_enabled: false
  signal_queue: # 信号の停止点そのものへ向かう最後の区間に自動で重ねる: waypoint の線上の待機列の後ろで止まる (経路は物体を避けたまま)
    parameters:
      /queue_guard:
        enabled: true
        use_route: true
        half_width: 0.5 # 列は waypoint の線上に並ぶ. 歩道のコーン列 (経路の横 0.7m 以上) を拾わない
        min_object_size: 0.48 # コーン (直径 0.36m, costmap で約 0.45m) を待機列のロボットとみなして止まらない
        tall_span: 0.78 # 上の点の高さの幅が 0.78m 以上の塊は小さくても数える: 脚 2 本に分かれて見える人を見落とさない. 坂でも効くよう足元からの高さでなく幅で見る (コーンは 0.7m, 0.2m 上り坂の人は 0.8m)
      /yield_guard:
        follow_enabled: false
