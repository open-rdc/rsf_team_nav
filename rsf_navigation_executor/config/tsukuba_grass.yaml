# 芝生 (シミュレータ・地図では通れるが, 完全に入ると失格). 確認走行区間 WP0-30 の経路から 1.1-8.0m の芝生を通行不可 (100)
# 点群地図の地面反射強度 (芝生は強い) から scripts/make_grass_mask.py で生成. 経路の ±1.1m は通路として常に空ける. 芝生の手前 0.6m は芝生に近いほど高い値 (最大 50)
# global 用: WP9-19 (following_center) の通路だけ芝生から 2.0m まで勾配を足した tsukuba_grass_center.pgm を使う (scripts/add_center_ramp.py で生成).
# keepout は inflation の後にかかるので inflation_radius を広げても芝生の縁から勾配が付かず, global path が入口の位置しだいで縁 (壁際) に沿うため.
# local (tsukuba_grass_soft.yaml) は元の tsukuba_grass.pgm のまま
image: tsukuba_grass_center.pgm
mode: raw
resolution: 0.2
origin: [-80.0, -10.0, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
