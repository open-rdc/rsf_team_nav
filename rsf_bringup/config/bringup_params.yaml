launch:
  ros__parameters:
    sim: true

joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4
    axis_linear:
      x: 1
    scale_linear:
      x: 1.0
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 1.0
